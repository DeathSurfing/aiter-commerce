[package]
name = "aiter-server"
description = "AITER COMMERCE thin HTTP server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# `cargo run -p aiter-server` should keep starting the HTTP server even though
# the package now ships three binaries (aiter-server, aiter-cli, mcp).
default-run = "aiter-server"

[dependencies]
aiter-core = { path = "../aiter-core" }
tokio.workspace = true
axum.workspace = true
tower = { workspace = true, features = ["util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2.workspace = true
hmac.workspace = true

[dev-dependencies]
base64 = "0.22"
