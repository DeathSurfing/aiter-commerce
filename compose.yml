# AITER COMMERCE — docker compose deployment for the aiter-server image.
#
# Usage:
#   cp .env.example .env        # fill in RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET /
#                               #   RAZORPAY_WEBHOOK_SECRET (the rest has defaults)
#   docker compose up           # builds aiter-commerce from . if the image is missing
#
# All runtime config is read from .env (env_file) — PORT, RUST_LOG, AITER_CONFIG,
# RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_MODE, RAZORPAY_WEBHOOK_SECRET.
# The container listens on $PORT; the host port is mapped 1:1 to the same value.
#
# No healthcheck: the image is distroless (no shell, no curl), so exec probes are
# impossible. Probe liveness externally:
#   curl -sf "localhost:${PORT:-8080}/agentic/health"   # or GET / on the same port
services:
  app:
    image: aiter-commerce
    build: .
    env_file: .env
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    restart: unless-stopped

  # --- Dev/test container ---------------------------------------------------
  # Runs CI's quality gates (fmt, clippy, test, build) inside a container, so
  # the host needs no Rust toolchain. Enabled only via its `dev` profile —
  # `docker compose up` never starts it. The repo is bind-mounted read-write,
  # so edits on the host are picked up immediately; cargo artifacts land in
  # named volumes so they persist across runs without touching your checkout.
  #
  #   docker compose run --rm dev                          # scripts/check.sh (all gates)
  #   docker compose run --rm dev cargo test --all-features
  #   docker compose run --rm dev cargo fmt --check
  #   docker compose run --rm dev cargo clippy --all-targets --all-features -- -D warnings
  dev:
    image: aiter-commerce-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    profiles: ["dev"]
    working_dir: /workspace
    command: bash scripts/check.sh
    volumes:
      - .:/workspace
      - cargo-target:/workspace/target
      - cargo-home:/usr/local/cargo/registry

volumes:
  cargo-target:
  cargo-home:
